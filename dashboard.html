<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaussQueue Monitor</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
  --accent: #3a6df0; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --track: #ececea;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --panel: #1c1c1e; --text: #ececea; --muted: #9a9a94; --line: #2c2c2e;
    --accent: #7aa2ff; --ok: #4cc47f; --warn: #e0a84a; --bad: #ff6b6b; --track: #2c2c2e;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 28px 0 10px; font-weight: 600; }
.stamp { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; opacity: .8; }
.live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.stale { background: var(--bad); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.now { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0; overflow: hidden; }
.now .hero { background: #000; min-height: 220px; display: flex; align-items: center; justify-content: center; }
.now .hero img { width: 100%; height: 100%; max-height: min(60vh, 520px); object-fit: contain; display: block; cursor: zoom-in; }
.now .info { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.name { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.phase { color: var(--muted); }
.bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.strip figure { margin: 0; flex: 0 0 auto; text-align: center; font-size: 11px; color: var(--muted); }
.strip img { height: 54px; border-radius: 6px; display: block; cursor: zoom-in; border: 2px solid transparent; }
.strip img.sel { border-color: var(--accent); }
.idle { padding: 28px 20px; color: var(--muted); text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-items: start; }
.card { overflow: hidden; display: flex; flex-direction: column; }
.thumb { aspect-ratio: 4 / 3; background: var(--track); display: flex; align-items: center;
  justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 0; }
.thumb { position: relative; overflow: hidden; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.thumb .note { padding: 12px; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .name { font-size: 14px; }
.meta { font-size: 12px; color: var(--muted); }
.exp { margin-top: 14px; }
.exp-rows { display: flex; flex-direction: column; gap: 6px; }
.exp-row { display: grid; grid-template-columns: minmax(90px, 160px) 90px 1fr; gap: 10px; align-items: center; font-size: 13px; }
.exp-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exp-bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.exp-bar > span { display: block; height: 100%; background: var(--accent); }
.exp-row.s-done .exp-bar > span { background: var(--ok); } .exp-row.s-failed { color: var(--bad); }
.exp-row.s-queued, .exp-row.s-waiting { color: var(--muted); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px;
  border: 1px solid currentColor; text-transform: uppercase; letter-spacing: .04em; }
.b-queued { color: var(--accent); } .b-arriving { color: var(--warn); }
.b-done { color: var(--ok); } .b-FAILED { color: var(--bad); } .b-cancelled { color: var(--muted); } .b-snapshot { color: var(--accent); }
.snaps { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.snaps .s-done { color: var(--ok); } .snaps .s-failed { color: var(--bad); }
.history .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 10px 12px; border-top: 1px solid var(--line); }
.history .row:first-child { border-top: 0; }
.history .row .thumb { aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; }
.history .detail { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 16px; text-align: center; }
.err { color: var(--bad); }
.quality { font-size: 12px; color: var(--muted); }
.quality b { color: var(--text); font-weight: 600; }
.b-held { color: var(--muted); }
.b-next { color: var(--ok); }
.card.held .thumb img { filter: grayscale(.8); opacity: .6; }
.toggle { align-self: flex-start; background: none; border: 0; padding: 2px 0; color: var(--accent);
  font: inherit; font-size: 12px; cursor: pointer; }
.settings { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.settings.with-help { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.scol { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.shead { display: flex; gap: 6px; align-items: stretch; }
.shead .seg { flex: 1; }
.helpbtn { flex: none; width: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.helpbtn:hover { background: var(--track); }
.helpbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
/* Help open on a queue card: the card stays one column and spans two rows; the help card
   sits in the next column under the neighbouring card (placed by placeHelp()). */
.grid { grid-auto-flow: row dense; }
.grid > .card.helping { grid-row: span 2; }
/* The help card's grid cell is invisible; the text sits in its own box, moved to line up with
   the setting, with the brace in the gutter between it and the capture's card. */
.helpcard { align-self: stretch; padding: 0 0 0 14px; background: none !important; border: 0 !important;
  box-shadow: none !important; }
.helpcard.on-left { padding: 0 14px 0 0; }
/* The brace is the box's edge on the card side: its arms run into the top and bottom borders. */
.helpcard .hbody { background: var(--panel); border: 1px solid var(--line); border-left: 0;
  border-radius: 0 12px 12px 0; box-shadow: var(--shadow); padding: 12px 14px 12px 10px; }
.helpcard.on-left .hbody { border-left: 1px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px;
  padding: 12px 10px 12px 14px; }
/* A curly brace in the gutter spans the help text, its point at the described setting's line. */
.help .hbody { position: relative; }
.help .brace { position: absolute; top: 0; left: -19px; width: 12px; height: 100%; overflow: visible;
  pointer-events: none;
  fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.helpcard .brace { left: -11px; top: -1px; height: calc(100% + 2px); }   /* arms meet the borders */
.helpcard.on-left .brace { left: auto; right: -11px; transform: scaleX(-1); }
.help { border-left: 1px solid var(--line); padding-left: 24px; font-size: 12.5px; line-height: 1.5;
  color: var(--muted); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.help .hname { font-size: 13px; font-weight: 600; color: var(--text); }
.help .hsel { color: var(--text); }
.help .hsel b { font-weight: 600; }
.help .hnote { font-size: 11.5px; }
.help .hbody { display: flex; flex-direction: column; gap: 8px; }
.help .hkeys { font-size: 11.5px; padding-top: 6px; border-top: 1px solid var(--line); }
[data-help-key].hl { outline: 1px dashed var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (max-width: 560px) {
  .settings.with-help { grid-template-columns: minmax(0, 1fr); }
  .settings.with-help .help { border-left: 0; border-top: 1px solid var(--line); padding: 10px 0 0; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; background: none; border: 0; border-left: 1px solid var(--line); padding: 5px 0;
  font: inherit; font-size: 12px; color: var(--text); cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 8px; }
.fields label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
.fields input, .fields select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; min-width: 0; }
.fields .changed { border-color: var(--accent); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions button { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.actions button:hover, .seg button:hover:not(.on) { background: var(--track); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls button { font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.controls button:disabled { opacity: .5; cursor: default; }
.controls button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.controls.bottom { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--track); }
.b-paused { color: var(--warn); }
.now .settings { border: 1px solid var(--line); border-radius: 10px; }
.now.paused .bar > div { background: var(--warn); }
.history .when { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.dls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.dl { font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); text-decoration: none; display: inline-flex; gap: 6px; align-items: baseline; }
.dl span { color: var(--muted); font-size: 11px; }
.dl:hover { background: var(--track); }
.history .when .top { display: flex; align-items: center; gap: 8px; }
.dismiss { background: none; border: 0; padding: 0 2px; font: inherit; font-size: 17px; line-height: 1;
  color: var(--muted); cursor: pointer; border-radius: 4px; }
.dismiss:hover { color: var(--text); background: var(--track); }
.requeue { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.requeue:hover { background: var(--track); }
@media (max-width: 720px) { .history .when { align-items: flex-start; } }
.flip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; user-select: none; }
.flip input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.flipfield { grid-column: span 2; padding-top: 2px; }
.spzbox { display: inline-flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text); }
.fields .flip { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
.fields .flip input { width: 15px; height: 15px; padding: 0; border: 0; flex: none; }
.cq { display: flex; flex-direction: column; gap: 3px; }
.cqbar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--track); }
.cqbar span { display: block; height: 100%; }
.cq-good { background: var(--ok); } .cq-fast { background: var(--warn); }
.cq-jump { background: var(--bad); } .cq-other { background: var(--muted); }
.cqtext { font-size: 12px; color: var(--muted); }
.cqtext .warn { color: var(--bad); font-weight: 600; }
.history .cq { margin-top: 4px; max-width: 520px; }
.machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.machine { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.machine .mname { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.machine .mstate { font-size: 13px; overflow-wrap: anywhere; }
.machine .mbar { height: 5px; background: var(--track); border-radius: 99px; overflow: hidden; }
.machine .mbar > div { height: 100%; background: var(--accent); }
.mdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.mdot.off { background: var(--muted); } .mdot.busy { background: var(--accent); }
#now { display: flex; flex-direction: column; gap: 12px; }
.onbadge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; color: var(--accent);
  border: 1px solid currentColor; text-transform: uppercase; letter-spacing: .04em; margin-left: 6px; vertical-align: 2px; }
.runon { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.runon select { font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); }
.serr { font-size: 12px; color: var(--bad); min-height: 0; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center;
  justify-content: center; z-index: 10; cursor: zoom-out; padding: 16px; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
#lightbox.open { display: flex; }
@media (max-width: 720px) {
  .now { grid-template-columns: 1fr; }
  .history .row { grid-template-columns: 72px minmax(0, 1fr); }
  .history .row .when { grid-column: 2; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>GaussQueue</h1>
    <span class="stamp" id="stamp" title="Time of the last successful refresh"></span>
    <div class="live"><span class="dot" id="dot"></span><span id="live">connecting…</span></div>
  </header>

  <h2>Machines</h2>
  <div id="machines" class="machines"></div>

  <h2>Training now</h2>
  <div id="now"><div class="panel"><div class="idle">Loading…</div></div></div>

  <h2 id="queue-h">Inbox</h2>
  <div id="queue"></div>

  <h2>Recent</h2>
  <div id="history" class="panel history"></div>
</main>
<div id="lightbox"><img alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = (name, alt) => name ? `<img src="/img/${encodeURIComponent(name)}" alt="" data-zoom loading="lazy" onerror="this.remove()">` : "";
const dur = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}h ${String(m).padStart(2,"0")}m` : m ? `${m}m` : `${s}s`; };
const clock = (t) => new Date(t*1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const size = (b) => b > 1e9 ? (b/1e9).toFixed(1)+" GB" : (b/1e6).toFixed(0)+" MB";
const kindText = (k, f) => [k && k !== "unknown" ? k : null, f ? `${f} frames` : null].filter(Boolean).join(" · ");

const PRESET_LABEL = {preview: "Preview", fast: "Fast", standard: "Standard", high: "High", custom: "Custom"};
const kfmt = (n) => n >= 1e6 ? `${+(n/1e6).toFixed(1)}M` : n >= 1000 ? `${+(n/1000).toFixed(1)}k` : String(n);
const qualityText = (st) => st ? `<b>${PRESET_LABEL[st.preset] || esc(st.preset)}</b> · ${kfmt(st.total_steps)} steps · ${st.max_resolution}px · SH${st.sh_degree} · ≤${kfmt(st.max_splats)} splats${st.subsample_frames > 1 ? ` · every ${st.subsample_frames} frames` : ""}${st.refine_poses ? " · refined poses" : ""}${st.trainer === "gsplat" ? ` · gsplat ${esc(st.densify || "")}${st.depth_supervision ? " +depth" : ""}${st.flatten ? " +flat" : ""}` : ""}${st.prune_pct ? ` · prune ${st.prune_pct}%` : ""}${st.flip_up ? " · flipped" : ""}${st.start_view ? " · starts at first photo" : ""}${(() => { const v = [3, 4].filter(n => st[`spz_v${n}`]); return v.join() === "3" ? "" : ` · spz ${v.length ? v.map(n => "v" + n).join("+") : "off"}`; })()}` : "";
const FIELD_OPTS = {
  max_resolution: [720, 960, 1080, 1280, 1440, 1920, 2560, 3840],
  sh_degree: [[0, "0 · flat colour"], [1, "1"], [2, "2"], [3, "3 · full sheen"]],
  max_splats: [500000, 1000000, 1500000, 3000000, 5000000, 10000000, 20000000],
  subsample_frames: [[1, "all"], [2, "every 2nd"], [3, "every 3rd"], [4, "every 4th"]],
};
const openSettings = new Set();   // queue items whose settings panel is expanded
const helpOpen = new Set();       // items whose settings show the help column ("?")
const helpKey = {};               // item -> setting the help column describes (last hovered/focused)
const itemErrors = {};            // name -> last error message from the server

const selectedBy = {};  // job name -> checkpoint preview chosen in its strip (absent = latest)
let last = null;       // latest /api/status payload, for the 1s clock ticker

// Only touch the DOM when a section's markup actually changed. Rebuilding
// identical HTML re-creates every <img>, which is what made the page flicker.
function setHTML(el, html) {
  if (el._html === html) return;
  el._html = html;
  el.innerHTML = html;
}

// Load an image before it goes on screen, so swapping a preview never blanks.
const loaded = new Set();
function preload(name) {
  if (!name || loaded.has(name)) return Promise.resolve();
  return new Promise((res) => {
    const i = new Image();
    i.onload = i.onerror = () => { loaded.add(name); res(); };
    i.src = `/img/${encodeURIComponent(name)}`;
  });
}

const heroName = (c) => {
  const previews = c.previews || [];
  const sel = selectedBy[c.name];
  return sel && previews.includes(sel) ? sel : (c.preview || c.thumb);
};

function editing(el) {
  const a = document.activeElement;
  return a && el.contains(a) && (a.tagName === "INPUT" || a.tagName === "SELECT");
}

function renderJobs(jobs) {
  const el = $("now");
  if (editing(el)) return;
  for (const k of Object.keys(selectedBy)) if (!jobs.some(j => j.name === k)) delete selectedBy[k];
  const exp = experimentsPanel(last && last.experiments);
  if (!jobs.length) {
    setHTML(el, exp || `<div class="panel"><div class="idle">Idle. Drop a capture (zip or folder with a COLMAP model) into <b>${esc(last && last.inbox_dir || "the inbox")}</b>.</div></div>`);
    return;
  }
  setHTML(el, jobs.map(jobPanel).join("") + exp);
  fillHelp();
}

// An experiment batch (tools/experiments.py): one row per variant. While it runs, the queue
// doesn't start captures on its machine.
function experimentsPanel(e) {
  if (!e || !(e.variants || []).length) return "";
  const w = (last.workers || []).find(x => x.name === e.worker);
  const row = (v) => {
    const res = v.psnr != null ? `PSNR ${v.psnr.toFixed(2)}${v.depth_err != null ? ` · depth ${(100 * v.depth_err).toFixed(1)}%` : ""}` : "";
    const st = v.state === "done" ? `✓ ${res}`
      : v.state === "running" ? `${v.step != null ? `step ${v.step.toLocaleString()} / ${(v.total || 0).toLocaleString()}` : "starting"}${v.eta ? ` · ends ${clock(v.eta)}` : ""}`
      : v.state === "failed" ? `failed${v.error ? ": " + esc(v.error) : ""}`
      : v.state === "waiting" ? `waiting: ${esc(v.waiting || "")}` : "queued";
    const pct = v.state === "done" ? 100 : v.step && v.total ? Math.min(100, 100 * v.step / v.total) : 0;
    return `<div class="exp-row s-${esc(v.state)}"><span class="exp-name" title="${esc((v.args || []).join(" "))}">${esc(v.name)}</span>
      <span class="exp-bar"><span style="width:${pct.toFixed(1)}%"></span></span><span class="exp-state">${st}</span></div>`;
  };
  const state = e.live ? (e.eta ? `done ~${clock(e.eta)}` : "running") : e.finished ? `finished ${clock(e.finished)}` : "stopped";
  return `<div class="panel exp"><div class="info">
    <div class="name">🧪 ${esc(e.name || "Experiments")}${w ? `<span class="onbadge">on ${esc(w.label)}</span>` : ""}</div>
    <div class="phase">${esc(state)}${e.live ? " · new captures wait for this machine" : ""}</div>
    ${e.note ? `<div class="meta">${esc(e.note)}</div>` : ""}
    <div class="exp-rows">${e.variants.map(row).join("")}</div></div></div>`;
}

function jobPanel(c) {
  const previews = c.previews || [];
  const hero = heroName(c);
  const pct = c.step != null && c.total ? Math.min(100, 100*c.step/c.total) : 0;
  const stepLabel = (n) => { const m = n.match(/_step(\d+)\.jpg$/); return m ? `${(+m[1]/1000).toFixed(1)}k` : ""; };
  const pend = c.pending_settings, run = c.settings;
  const changed = c.paused && pend && run && ["total_steps", "max_resolution", "sh_degree", "max_splats", "subsample_frames", "refine_poses",
    "trainer", "densify", "depth_supervision", "flatten"].some(k => (pend[k] || 0) !== (run[k] || 0));
  const canPause = c.phase === "training" || c.paused;
  const controls = canPause && last.presets ? `
      <div class="controls" data-item="${esc(c.name)}">
        ${c.paused
          ? `<span class="badge b-paused">paused</span>
             <button data-act="snapshot" title="Turn the latest checkpoint into a result you can open now (as <name>-step<N>).">Publish snapshot</button>`
          : `<button data-act="snapshot" title="Turn the latest checkpoint into a result you can open now (as <name>-step<N>). Training keeps going; processing waits until it can't slow the run.">Publish snapshot</button>
             ${flipBox(pend && pend.flip_up)} ${startViewBox(pend && pend.start_view)} ${spzBoxes(pend)}`}
      </div>
      ${!c.paused && itemErrors[c.name] ? `<div class="serr">${esc(itemErrors[c.name])}</div>` : ""}
      ${(c.snapshots || []).length ? `<div class="snaps">${c.snapshots.map(sn => {
          const label = sn.state === "done" ? "✓ ready in the outbox"
            : sn.state === "processing" ? "processing…"
            : sn.state === "failed" ? `failed: ${esc(sn.error || "")}`
            : `queued${sn.waiting ? `: ${esc(sn.waiting)}` : ""}`;
          return `<div class="s-${esc(sn.state)}">📸 step ${(sn.step || 0).toLocaleString()}: ${label}${dlButtons(sn.result, sn.downloads)}</div>`; }).join("")}</div>` : ""}
      ${c.paused ? `${settingsHTML({name: c.name, settings: pend, photo_px: c.photo_px}, true)}
        <div class="meta">${changed ? "Changed settings restart training from step 0 (the capture stays on local disk)." : "Change settings to restart from step 0 with them, or resume where it stopped."}</div>` : ""}` : "";
  const bottom = last.presets ? `
      <div class="controls bottom" data-item="${esc(c.name)}">
        ${!canPause ? "" : c.paused
          ? `<button class="primary" data-act="resume">${changed ? "Restart with new settings" : "Resume"}</button>`
          : `<button data-act="pause" title="${c.remote ? "Freezes training on the PC in place (it keeps its GPU memory)." : "Freezes training in place; the Mac can sleep meanwhile."}">Pause</button>`}
        <button class="danger" data-act="cancel" title="Stop this capture now. It moves to inbox/failed; Requeue in Recent runs it again.">Cancel</button>
      </div>` : "";
  // Time-dependent values (elapsed, ETA) are left as empty slots and filled by tick().
  return `<div class="panel now${c.paused ? " paused" : ""}" data-job="${esc(c.name)}">
    <div class="hero">${hero ? img(hero, c.name) : `<span class="meta">no preview yet</span>`}</div>
    <div class="info">
      <div class="name">${esc(c.name)}${c.worker_label ? `<span class="onbadge">on ${esc(c.worker_label)}</span>` : ""}</div>
      <div class="phase">${esc(c.phase)}${kindText(c.kind, c.frames) ? " · " + esc(kindText(c.kind, c.frames)) : ""}</div>
      ${c.settings ? `<div class="quality">${qualityText(c.settings)}</div>` : ""}
      ${captureQuality(c.quality)}
      ${controls}
      <div class="bar"><div style="width:${pct.toFixed(1)}%"></div></div>
      <div class="stats">
        <div class="stat"><div class="k">Step</div><div class="v">${c.step != null ? `${c.step.toLocaleString()} / ${(c.total||0).toLocaleString()}` : "—"}</div></div>
        <div class="stat"><div class="k">Elapsed</div><div class="v" data-t="elapsed">—</div></div>
        <div class="stat"><div class="k">Training ends</div><div class="v" data-t="eta">—</div></div>
        <div class="stat" title="Training plus the usual post-processing on this machine (download, pruning, compression, copying out), from its recent runs."><div class="k">Done</div><div class="v" data-t="done">—</div></div>
      </div>
      ${previews.length ? `<div class="strip">${previews.map(p => `
        <figure><img src="/img/${encodeURIComponent(p)}" data-pick="${esc(p)}" data-job="${esc(c.name)}" class="${p === hero ? "sel" : ""}" alt="">${stepLabel(p)}</figure>`).join("")}</div>
        <div class="meta">Click a checkpoint to show it above; renders are from a camera held out of training.</div>` : ""}
      ${bottom}
    </div>
  </div>`;
}

function renderMachines(ws) {
  if (!ws || !ws.length) { setHTML($("machines"), ""); return; }
  setHTML($("machines"), ws.map(w => {
    const j = w.job;
    const pct = j && j.step != null && j.total ? Math.min(100, 100 * j.step / j.total) : 0;
    const state = !w.online ? "offline"
      : j ? `${esc(j.name)} · ${j.step != null ? `${j.step.toLocaleString()}/${(j.total || 0).toLocaleString()}` : esc(j.phase || "")}`
      : "idle";
    const extra = w.remote
      ? (w.online && w.vram_total_mb ? `GPU ${w.gpu_util}% · ${(w.vram_used_mb / 1024).toFixed(1)}/${(w.vram_total_mb / 1024).toFixed(0)} GB VRAM` : "")
      : (w.mem_free_pct != null ? `memory ${w.mem_free_pct}% free` : "");
    return `<div class="panel machine">
      <div class="mname"><span class="mdot ${!w.online ? "off" : j ? "busy" : ""}"></span>${esc(w.label)}</div>
      <div class="mstate">${state}</div>
      ${j ? `<div class="mbar"><div style="width:${pct.toFixed(1)}%"></div></div>` : ""}
      <div class="meta">${extra}</div>
    </div>`; }).join(""));
}

// SplatKing's per-photo capture ratings (from splatpack.json).
function cqClass(label) {
  return /pose jump/.test(label) ? "cq-jump" : /fast/.test(label) ? "cq-fast"
       : /stable/.test(label) ? "cq-good" : "cq-other";
}
function captureQuality(q) {
  if (!q || !q.ratings) return "";
  const order = {"cq-good": 0, "cq-fast": 1, "cq-other": 2, "cq-jump": 3};
  const rs = [...q.ratings].sort((a, b) => order[cqClass(a.label)] - order[cqClass(b.label)]);
  const tip = `SplatKing's rating of each photo at capture time (${q.photos} photos):\n`
    + q.ratings.map(r => `${r.count} × ${r.band}: ${r.label}`).join("\n")
    + `\n\n"Large pose jump" means the phone moved or turned too far between photos (low overlap).`;
  const top = q.ratings.slice(0, 3).map(r => `${r.pct}% ${esc(r.label)}`).join(" · ");
  return `<div class="cq" title="${esc(tip)}">
      <div class="cqbar">${rs.map(r => `<span class="${cqClass(r.label)}" style="width:${r.pct}%"></span>`).join("")}</div>
      <div class="cqtext">${q.low_overlap ? `<span class="warn">⚠ low overlap</span> · ` : ""}capture score ${q.score ?? "?"} · ${top}</div>
    </div>`;
}

// "Flip vertical": output-only (rotates the result 180° about X), so it can change any time.
function flipBox(on) {
  return `<label class="flip" title="Rotate the result 180° so it's the right way up in most viewers. Applied to the output files after training; never restarts training.">
    <input type="checkbox" data-set="flip_up"${on ? " checked" : ""}> Flip vertical</label>`;
}

// "Start view": output-only too (moves/turns the result so it opens at the first photo).
function startViewBox(on) {
  return `<label class="flip" title="Move the result so its origin is where you took the first photo, turned (left/right only) to face that photo's direction. Viewers that start at the origin open on your first shot. Applied to the output files after training; never restarts training.">
    <input type="checkbox" data-set="start_view"${on ? " checked" : ""}> Start at first photo</label>`;
}

// SPZ versions written (output-only): <name>.v3.spz and/or <name>.v4.spz.
function spzBoxes(st) {
  const box = (v) => `<label class="flip" title="Write ${v === 3 ? "SPZ v3 (gzip; opens nearly everywhere)" : "SPZ v4 (zstd; newer, only recent apps read it)"} as <name>.v${v}.spz. Output only; never restarts training.">
    <input type="checkbox" data-set="spz_v${v}"${st && st[`spz_v${v}`] ? " checked" : ""}> v${v}</label>`;
  return `<span class="spzbox">SPZ ${box(3)} ${box(4)}</span>`;
}

// "Refine camera poses": COLMAP bundle adjustment before training (changes the input, so it restarts).
function refineBox(on) {
  return `<label class="flip" title="Before training, refine the capture's camera poses with COLMAP (feature matching + bundle adjustment). Takes a few minutes; usually sharper, especially for foliage and long walks.">
    <input type="checkbox" data-set="refine_poses"${on ? " checked" : ""}> Refine camera poses (COLMAP)</label>`;
}

// Text-valued settings (trainer, densify): sent as strings, not numbers.
function choiceHTML(key, value, opts) {
  return `<select data-set="${key}" data-choice="1">${opts.map(([v, l]) =>
    `<option value="${esc(v)}"${v === value ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
}

// gsplat + pruning controls; only shown when some machine has gsplat (CUDA).
function gsplatHTML(st) {
  if (!(last.workers || []).some(w => w.gsplat)) return "";
  const gs = st.trainer === "gsplat";
  const check = (key, label, title) => `<label class="flip" title="${title}">
    <input type="checkbox" data-set="${key}"${st[key] ? " checked" : ""}> ${label}</label>`;
  return `
        <div class="flipfield runon" data-help-key="trainer" title="Brush runs on any machine. gsplat (CUDA) adds LiDAR depth supervision, flat splats and MCMC; it only runs on machines that have it.">Trainer
          ${choiceHTML("trainer", st.trainer || "brush", [["brush", "Brush"], ["gsplat", "gsplat (CUDA)"]])}</div>
        ${gs ? `<div class="flipfield runon" data-help-key="densify" title="How splats are added during training. Default: classic 3DGS growth. Abs-grad: grows more in fine detail. MCMC: fixed budget, always ends at the splat cap.">Densify
          ${choiceHTML("densify", st.densify || "mcmc", [["mcmc", "MCMC (fixed budget)"], ["default", "Default"], ["absgrad", "Abs-grad"]])}</div>
        <div class="flipfield" data-help-key="depth_supervision">${check("depth_supervision", "LiDAR depth", "Match the LiDAR depth maps where the iPhone is confident (near surfaces). Sky and far scenery are left to the photos.")}</div>
        <div class="flipfield" data-help-key="flatten">${check("flatten", "Flatten splats", "Push splats flat onto surfaces: crisper walls and ground, fewer floaters.")}</div>` : ""}
        <div class="flipfield runon" data-help-key="prune_pct" title="After training, remove this share of splats (the ones that matter least to the photos) and fine-tune the rest. Runs on a CUDA machine; the unpruned result is kept in the work folder.">Prune
          ${choiceHTML("prune_pct", String(st.prune_pct || 0), [["0", "Off"], ["50", "50%"], ["70", "70%"], ["80", "80%"], ["90", "90%"]])}</div>`;
}

// "Est. time 1h05m (Mac: 52m training) · 21m (RTX 4080: 12m training)": the whole job, start to
// result, on every machine that could run it on Auto, else on the chosen one.
const shortLabel = (w) => (w.label.match(/\(([^)]+)\)/) || [])[1] || w.label;
function etaLine(it) {
  const est = it.est || {};
  const parts = (last.workers || []).filter(w => w.name in est)
    .map(w => { const e = est[w.name] || {};
      if (!e.total) return `? (${esc(shortLabel(w))})`;
      return e.train && e.total - e.train >= 60
        ? `${dur(e.total)} (${esc(shortLabel(w))}: ${dur(e.train)} training)`
        : `${dur(e.total)} (${esc(shortLabel(w))})`; });
  if (!parts.length && it.est_seconds) parts.push(dur(it.est_seconds));
  return parts.length ? `<div class="quality"><b>Est. time</b> ${parts.join(" · ")}</div>` : "";
}

// Download buttons for a result's files (<name>.ply, .v3.spz, .v4.spz), saved by the browser.
function dlButtons(name, downloads) {
  if (!name || !(downloads || []).length) return "";
  return `<div class="dls">${downloads.map(d =>
    `<a class="dl" href="/download/${encodeURIComponent(name)}/${encodeURIComponent(d.file)}" download="${esc(d.file)}"
       title="Save ${esc(d.file)} (${size(d.size)})">${esc(d.file.slice(name.length))} <span>${size(d.size)}</span></a>`).join("")}</div>`;
}

function selectHTML(key, value, opts) {
  const list = opts.map(o => Array.isArray(o) ? o : [o, key === "max_splats" ? kfmt(o) : String(o)]);
  if (!list.some(([v]) => v === value)) list.push([value, key === "max_splats" ? kfmt(value) : String(value)]);
  list.sort((a, b) => a[0] - b[0]);
  return `<select data-set="${key}">${list.map(([v, l]) => `<option value="${v}"${v === value ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
}

// One short purpose line per setting, plus what the selected option does. Shown in the
// help column ("?" on a settings panel); keep each to a sentence or two.
const HELP = {
  preset: {name: "Quality preset", what: "A starting point for the training settings below. Changing any field makes it Custom.",
    opts: {preview: "Quick look: is the scene coherent, the right way up, covered? 3k steps at 720 px; minutes. Not for judging detail.",
           fast: "7k steps at 1080 px, up to 1.5M splats. A usable result quickly.",
           standard: "Your everyday default, set in config.json.",
           high: "30k steps at 1920 px, up to 10M splats. The most detail; about an hour on the PC, several on the Mac.",
           custom: "You've changed at least one field from the preset."}},
  total_steps: {name: "Training steps", what: "How long training runs. More steps refine detail, with diminishing returns past about 30k.",
    val: (v) => `${(+v).toLocaleString()} steps. Time grows roughly in proportion.`},
  max_resolution: {name: "Max resolution", what: "Photos are scaled down to this width for training. Higher keeps fine texture but costs time and memory; photos are never upscaled.",
    val: (v) => `Trains on photos up to ${v} px wide.`},
  sh_degree: {name: "Colour detail (SH)", what: "How much a splat's colour can change with viewing angle: sheen, reflections, glints.",
    opts: {0: "Flat colour per splat. Smallest files; matte look.", 1: "Gentle view-dependent shading.",
           2: "Most sheen and reflections.", 3: "Full view-dependent colour (the 3DGS standard). Largest files."}},
  max_splats: {name: "Splat cap", what: "Upper limit on splats. Brush and Default densify stop growing at it; MCMC always ends exactly at it. gsplat runs are capped at 6M regardless.",
    val: (v) => `Up to ${kfmt(+v)} splats.`},
  subsample_frames: {name: "Frames used", what: "Train on every Nth photo. Faster, but less overlap between neighbouring photos, which hurts sharpness.",
    val: (v) => +v === 1 ? "All photos." : `Every ${v} photos (${Math.round(100 / v)}% of them).`},
  run_on: {name: "Run on", what: "Which machine trains this capture.",
    opts: {auto: "Auto: the first machine that's free, PC first. gsplat captures wait for a machine that has gsplat."},
    val: (v) => { const w = (last.workers || []).find(x => x.name === v); return w ? `Only ${w.label}.` : ""; }},
  refine_poses: {name: "Refine camera poses", what: "Before training, COLMAP matches features between photos and corrects the phone's camera poses. Also adds distant feature points as starting splats.",
    opts: {1: "On: a few minutes on the Mac first; sharper results, especially foliage and long walks.", 0: "Off: trains on ARKit's poses as captured."}},
  trainer: {name: "Trainer", what: "The program that turns the photos into splats.",
    opts: {brush: "Brush: runs on the Mac or the PC. No depth supervision.",
           gsplat: "gsplat (CUDA, PC only): adds LiDAR depth, flatten, MCMC and floater carving. Held-out depth error about 2% vs 45% for Brush in tests."}},
  densify: {name: "Densify", what: "How splats are added and moved during training.",
    opts: {mcmc: "MCMC: a fixed budget that always ends at the splat cap, moving weak splats to where they're needed. Best in tests.",
           default: "Default: classic 3DGS growth. Can hit the cap early and stop growing.",
           absgrad: "Abs-grad: grows more in fine detail. No better than Default in tests."}},
  depth_supervision: {name: "LiDAR depth", what: "Pulls rendered depth toward the iPhone's LiDAR wherever it was confident (near surfaces, up to about 5 m). Sky and far scenery are left to the photos.",
    opts: {1: "On: correct geometry (held-out depth error about 2% instead of 40%), fewer floaters.", 0: "Off: geometry only has to look right from the photos."}},
  flatten: {name: "Flatten splats", what: "Pushes each splat's thinnest axis toward zero so splats lie flat on surfaces.",
    opts: {1: "On: crisper walls, ground and stone; slightly less fine texture.", 0: "Off: splats keep any shape."}},
  prune_pct: {name: "Prune", what: "After training, removes the splats that matter least to the photos, then fine-tunes the rest for 3,000 steps. Runs on the PC; the unpruned result is kept. Snapshots get a quick prune instead (by opacity and size, no fine-tuning), since the GPU is busy training.",
    val: (v) => +v ? `Removes ${v}%: keeps ${100 - v}% of the splats. In tests even 90% kept the same score; the finest texture goes first.` : "Off: keeps every splat."},
  flip_up: {name: "Flip vertical", what: "Turns the result 180° so it's the right way up in viewers that expect -Y up. Output only; never restarts training.",
    opts: {1: "On: right way up in SuperSplat and most viewers.", 0: "Off: kept in SplatKing's +Y-up orientation."}},
  spz: {name: "SPZ files", what: "Compressed copies for viewers and phones, written next to the .ply as <name>.v3.spz and <name>.v4.spz. Output only.",
    val: (v) => ({"3": "v3 only: gzip-wrapped, opens in nearly every splat app.",
                  "4": "v4 only: zstd, faster to load, but only recent apps read it (Niantic tools, PlayCanvas, Postshot).",
                  "3+4": "Both: v3 for compatibility, v4 for apps that support it.",
                  "": "None: only the .ply is written."})[v]},
  start_view: {name: "Start at first photo", what: "Moves the result so its origin is where you took the first photo, turned (left/right only) to face that photo's direction. Viewers that start at the origin open on your first shot. Output only.",
    opts: {1: "On: opens at your first photo, horizon level.", 0: "Off: original capture coordinates."}},
};

function helpValue(key, st, it) {
  if (key === "run_on") return it.run_on || "auto";
  if (key === "preset") return st.preset;
  if (key === "spz") return [3, 4].filter(v => st[`spz_v${v}`]).join("+");
  return st[key];
}

function helpHTML(key, st, it) {
  const h = HELP[key] || HELP.preset;
  const v = helpValue(HELP[key] ? key : "preset", st, it);
  const opt = h.opts && h.opts[v] !== undefined ? h.opts[v] : (h.val ? h.val(v) : "");
  return `<div class="hbody"><div class="hname">${esc(h.name)}</div>
    <div>${esc(h.what)}</div>
    ${opt ? `<div class="hsel"><b>Selected:</b> ${esc(opt)}</div>` : ""}
    <div class="hkeys">Hover or tap a setting to see what it does.</div></div>`;
}

// Fill each open help column from state (kept out of the panel's markup so the 3 s refresh
// doesn't rebuild cards, and their images, whenever the described setting changes).
function fillHelp() {
  document.querySelectorAll("[data-help-panel]").forEach((el) => {
    const name = el.dataset.helpPanel;
    const it = (last.queue || []).find(q => q.name === name)
      || (last.jobs || []).map(j => ({name: j.name, settings: j.pending_settings || j.settings})).find(j => j.name === name);
    if (!it || !it.settings) return;
    const key = helpKey[name] || "preset";
    const html = helpHTML(key, it.settings, it);
    if (el._html !== html) { el._html = html; el.innerHTML = html; }
    const panel = settingsFor(name);
    if (panel) panel.querySelectorAll("[data-help-key]").forEach(f => f.classList.toggle("hl", f.dataset.helpKey === key));
  });
  requestAnimationFrame(alignHelp);
}

// A "{" 12 units wide and h tall whose point is at height tip (anywhere along it): the arms
// curl in from the right at both ends, the point juts out to the left.
// e: how far in from the top/bottom the arms run (on the box's border lines for help cards).
function bracePath(h, tip, e = 0.7) {
  const x = 6.5, r1 = Math.min(5.5, (tip - e) / 2), r2 = Math.min(5.5, (h - e - tip) / 2);
  const a = Math.min(4, (tip - e) / 2), b = Math.min(4, (h - e - tip) / 2);   // curl into the point
  return `M 12 ${e} Q ${x} ${e} ${x} ${r1 + e}` +
         ` L ${x} ${Math.max(r1 + e, tip - a)} Q ${x} ${tip} ${x - 5} ${tip}` +
         ` Q ${x} ${tip} ${x} ${Math.min(h - r2 - e, tip + b)}` +
         ` L ${x} ${h - r2 - e} Q ${x} ${h - e} 12 ${h - e}`;
}

// Box of the first visible line of text inside an element (a setting's label).
function firstTextRect(el) {
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT,
    {acceptNode: (n) => n.textContent.trim() && !n.parentElement.closest("select, option") ? 1 : 3});
  const node = w.nextNode();
  if (!node) return null;
  const range = document.createRange();
  range.selectNodeContents(node);
  const rects = range.getClientRects();
  return rects.length ? rects[0] : null;
}

const settingsFor = (name) => document.querySelector(`.settings[data-item="${CSS.escape(name)}"]`);

// Line each help text up with the setting it describes (when it sits beside the controls).
function alignHelp() {
  document.querySelectorAll("[data-help-panel]").forEach((el) => {
    const panel = settingsFor(el.dataset.helpPanel);
    const body = el.firstElementChild, target = panel && panel.querySelector("[data-help-key].hl");
    if (!body || !target) return;
    const beside = el.getBoundingClientRect().left >= panel.getBoundingClientRect().right - 1
                || el.getBoundingClientRect().right <= panel.getBoundingClientRect().left + 1;
    el.classList.toggle("beside", beside);
    if (!beside) { body.style.transform = ""; body.querySelector(":scope > .brace")?.remove(); return; }
    // Centre the title on the setting's own label text (its first line of text).
    const label = firstTextRect(target) || target.getBoundingClientRect();
    const title = body.querySelector(".hname");
    const pad = parseFloat(getComputedStyle(el).paddingTop) || 0;
    // Aim for the title on the setting's line; near the bottom the text is pushed up instead
    // (the brace's point still lands on the setting).
    const room = el.clientHeight - pad * 2 - body.offsetHeight;
    const y = (label.top + label.height / 2) - el.getBoundingClientRect().top - pad - (title.offsetTop + title.offsetHeight / 2);
    const shift = Math.round(Math.max(0, Math.min(y, room)));
    body.style.transform = `translateY(${shift}px)`;
    // Brace from the top to the bottom of the help text, pointing at the setting's line.
    const h = body.offsetHeight;
    const tip = Math.max(2, Math.min(h - 2, (label.top + label.height / 2) - el.getBoundingClientRect().top - pad - shift));
    let svg = body.querySelector(":scope > .brace");
    if (!svg) {
      svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "brace");
      svg.setAttribute("aria-hidden", "true");
      svg.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "path"));
      body.prepend(svg);
    }
    // help cards: the brace is 1 px taller each way so its arms sit on the box's borders
    const card = el.classList.contains("helpcard"), H = card ? h + 2 : h;
    svg.setAttribute("viewBox", `0 0 12 ${H}`);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.firstChild.setAttribute("d", bracePath(H, card ? tip + 1 : tip, card ? 1.5 : 0.7));
  });
}
window.addEventListener("resize", () => requestAnimationFrame(() => { placeHelp(true); alignHelp(); }));

function settingsHTML(it, isCurrent) {
  const st = it.settings, base = (last.presets || {})[st.base] || {};
  const cls = (k) => st.preset === "custom" && base[k] !== undefined && base[k] !== st[k] ? "changed" : "";
  const field = (k, label, inner) => `<label data-help-key="${k}">${label}${inner.replace("<select", `<select class="${cls(k)}"`).replace("<input", `<input class="${cls(k)}"`)}</label>`;
  const help = helpOpen.has(it.name);
  const inline = help && isCurrent;   // the running capture's panel has room beside its controls
  return `
    <div class="settings${help ? " helping" : ""}${inline ? " with-help" : ""}" data-item="${esc(it.name)}">
     <div class="scol">
      <div class="shead">
        <div class="seg" data-help-key="preset">${["preview", "fast", "standard", "high"].map(p => `
          <button data-act="preset" data-value="${p}" class="${st.preset === p ? "on" : ""}"
            title="${esc(Object.entries(last.presets[p] || {}).map(([k, v]) => `${k}: ${v}`).join(", "))}">${PRESET_LABEL[p]}</button>`).join("")}</div>
        <button class="helpbtn" data-help="${esc(it.name)}" aria-pressed="${help}" title="${help ? "Hide" : "Show"} what each setting does" aria-label="${help ? "Hide" : "Show"} setting help">?</button>
      </div>
      <div class="fields">
        ${field("total_steps", "Training steps", `<input data-set="total_steps" type="number" min="${last.limits.total_steps[0]}" max="${last.limits.total_steps[1]}" step="500" value="${st.total_steps}">`)}
        ${field("max_resolution", "Max resolution (px)", selectHTML("max_resolution", st.max_resolution,
            // no point offering more than the capture's own photos (they're never upscaled)
            it.photo_px ? FIELD_OPTS.max_resolution.filter(v => v <= it.photo_px) : FIELD_OPTS.max_resolution))}
        ${field("sh_degree", "Colour detail (SH)", selectHTML("sh_degree", st.sh_degree, FIELD_OPTS.sh_degree))}
        ${field("max_splats", "Splat cap", selectHTML("max_splats", st.max_splats, FIELD_OPTS.max_splats))}
        ${field("subsample_frames", "Frames used", selectHTML("subsample_frames", st.subsample_frames, FIELD_OPTS.subsample_frames))}
        ${!isCurrent && last.workers && last.workers.length > 1 ? `<div class="flipfield runon" data-help-key="run_on">Run on
          <select data-runon>${[["auto", "Auto (first available)"], ...last.workers.map(w => [w.name, w.label])].map(([v, l]) =>
            `<option value="${esc(v)}"${(it.run_on || "auto") === v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></div>` : ""}
        <div class="flipfield" data-help-key="refine_poses">${refineBox(st.refine_poses)}</div>
        ${gsplatHTML(st)}
        <div class="flipfield" data-help-key="flip_up">${flipBox(st.flip_up)}</div>
        <div class="flipfield" data-help-key="start_view">${startViewBox(st.start_view)}</div>
        <div class="flipfield" data-help-key="spz">${spzBoxes(st)}</div>
      </div>
      <div class="actions">
        ${isCurrent ? "" : `<button data-act="run_next">Run next</button>
        <button data-act="hold" data-value="${it.hold ? "false" : "true"}">${it.hold ? "Resume" : "Hold"}</button>`}
        ${st.preset !== "standard" ? `<button data-act="reset">Reset</button>` : ""}
      </div>
      ${itemErrors[it.name] ? `<div class="serr">${esc(itemErrors[it.name])}</div>` : ""}
     </div>
     ${inline ? `<aside class="help" data-help-panel="${esc(it.name)}" aria-live="polite"></aside>` : ""}
    </div>`;
}

function renderQueue(q) {
  $("queue-h").textContent = `Inbox (${q.length})`;
  // Don't rebuild while someone is typing in a settings field.
  if (editing($("queue"))) return;
  if (!q.length) { setHTML($("queue"), `<div class="panel empty">Nothing waiting.</div>`); return; }
  const editable = !!(last && last.presets);
  let pos = 0;
  setHTML($("queue"), `<div class="grid">${q.map((it) => {
    const queued = it.state === "queued" && !it.hold;
    if (queued) pos++;
    const badge = it.hold ? `<span class="badge b-held">on hold</span>`
      : queued ? `<span class="badge b-queued">#${pos} in queue</span>`
      : `<span class="badge b-${esc(it.state)}">${esc(it.state)}</span>`;
    return `
    <div class="panel card${it.hold ? " held" : ""}" data-card="${esc(it.name)}">
      <div class="thumb">${it.thumb ? img(it.thumb, it.name) : `<span class="note">${esc(it.thumb_note || "making thumbnail…")}</span>`}</div>
      <div class="body">
        <div class="name">${esc(it.name)}</div>
        <div>${badge}${it.run_next && !it.hold ? ` <span class="badge b-next">next</span>` : ""}</div>
        <div class="meta">${esc([kindText(it.kind, it.frames), it.size ? size(it.size) : null, it.is_dir ? "folder" : "zip"].filter(Boolean).join(" · "))}</div>
        ${captureQuality(it.quality)}
        ${it.settings ? `<div class="quality">${qualityText(it.settings)}</div>` : ""}
        ${etaLine(it)}
        <div class="meta">seen <span data-since="${it.first_seen}"></span> ago</div>
        ${editable && it.settings ? `<button class="toggle" data-toggle="${esc(it.name)}">${openSettings.has(it.name) ? "Hide settings" : "Settings"}</button>` : ""}
      </div>
      ${editable && it.settings && openSettings.has(it.name) ? settingsHTML(it) : ""}
    </div>
    ${editable && it.settings && openSettings.has(it.name) && helpOpen.has(it.name)
      ? `<aside class="panel help helpcard" data-help-panel="${esc(it.name)}" aria-live="polite"></aside>` : ""}`; }).join("")}</div>`);
  placeHelp();
  fillHelp();
}

// Put each open help card beside its capture's card: in the next column (the previous one if
// the card is in the last column), one row down, i.e. under the neighbouring card. The card
// itself spans two rows; dense auto-placement lets later cards fill in around them.
function placeHelp(force) {
  document.querySelectorAll(".grid > .helpcard").forEach((help) => {
    const grid = help.parentElement;
    const card = grid.querySelector(`[data-card="${CSS.escape(help.dataset.helpPanel)}"]`);
    if (!card) return;
    const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length;
    if (!force && help.dataset.cols === String(cols)) return;   // already placed for this layout
    help.dataset.cols = String(cols);
    help.style.gridColumn = help.style.gridRow = help.style.minHeight = "";
    card.classList.toggle("helping", cols > 1);
    if (cols < 2) { card.after(help); return; }
    grid.appendChild(help);   // out of the way while measuring
    const g = grid.getBoundingClientRect(), r = card.getBoundingClientRect();
    const step = r.width + (parseFloat(getComputedStyle(grid).columnGap) || 0);
    const col = Math.round((r.left - g.left) / step);   // 0-based
    // the last card that starts on the same row as this one
    let end = card;
    for (let n = card.nextElementSibling; n; n = n.nextElementSibling)
      if (n.classList.contains("card") && Math.abs(n.getBoundingClientRect().top - r.top) < 2) end = n;
    end.after(help);
    const hcol = col + 1 < cols ? col + 1 : col - 1;
    help.style.gridColumn = String(hcol + 1);
    help.classList.toggle("on-left", col + 1 >= cols);
    // Cards in the open card's first row (other than it), and whether one sits where the help goes.
    let rowH = 0, occupied = false;
    for (const n of grid.children) {
      if (n === card || !n.classList.contains("card")) continue;
      const nr = n.getBoundingClientRect();
      if (Math.abs(nr.top - r.top) >= 2) continue;
      rowH = Math.max(rowH, nr.height);
      if (Math.round((nr.left - g.left) / step) === hcol) occupied = true;
    }
    if (!occupied) {
      // Nothing beside the card: the help spans the same two rows, i.e. the card's full height.
      help.style.gridRow = "span 2";
      return;
    }
    // Under the neighbour: let the second row absorb the open card's extra height, so the first
    // row stays as tall as its other cards (a spanning item otherwise stretches both rows evenly).
    const gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
    help.style.minHeight = `${Math.max(0, card.getBoundingClientRect().height - rowH - gap)}px`;
  });
}

async function sendItem(name, body) {
  try {
    const r = await fetch("/api/item", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({name, ...body})});
    const j = await r.json().catch(() => ({}));
    if (r.ok) delete itemErrors[name]; else itemErrors[name] = j.error || `error ${r.status}`;
  } catch (e) { itemErrors[name] = "service not reachable"; }
  const a = document.activeElement;
  if (a && ($("queue").contains(a) || $("now").contains(a))) a.blur();
  await refresh();
}

function renderHistory(h) {
  if (!h.length) { setHTML($("history"), `<div class="empty">No finished jobs yet.</div>`); return; }
  setHTML($("history"), h.map(r => `
    <div class="row">
      <div class="thumb">${img(r.preview || r.thumb, r.name)}</div>
      <div>
        <div class="name">${esc(r.name)} <span class="badge b-${esc(r.result)}">${esc(r.result)}</span></div>
        <div class="detail">${esc(r.duration)}${r.detail ? " · " + esc(r.detail) : ""}${r.result === "done" ? ` · outbox/${esc(r.name)}/` : ""}</div>
        ${captureQuality(r.quality)}
        ${dlButtons(r.name, r.downloads)}
      </div>
      <div class="when">
        <div class="top"><span class="meta">${esc(r.finished)}</span>
          <button class="dismiss" data-dismiss="${esc(r.id)}" data-name="${esc(r.name)}" title="Remove from Recent (the result stays in the outbox)" aria-label="Remove ${esc(r.name)} from Recent">×</button></div>
        ${r.requeueable && last.presets ? `<button class="requeue" data-requeue="${esc(r.name)}" title="Move the original capture back into the inbox, on hold, to rerun it with different settings">Requeue</button>` : ""}
        ${itemErrors[r.name] && r.requeueable ? `<div class="serr">${esc(itemErrors[r.name])}</div>` : ""}
      </div>
    </div>`).join(""));
}

// Update clocks in place every second without re-rendering anything.
function tick() {
  if (!last) return;
  const now = Date.now()/1000;
  const age = now - last.updated;
  $("dot").classList.toggle("stale", age > 60);
  $("live").textContent = age > 60 ? `stale: last update ${dur(age)} ago` :
    `live · ${last.settings.total_steps.toLocaleString()} steps @ ${last.settings.max_resolution}px`;
  const set = (sel, text) => document.querySelectorAll(sel).forEach(e => { if (e.textContent !== text) e.textContent = text; });
  for (const c of (last.jobs || [])) {
    const t = c.paused && c.paused_at ? c.paused_at : now;
    const sel = (k) => `[data-job="${CSS.escape(c.name)}"] [data-t="${k}"]`;
    set(sel("elapsed"), c.started ? dur(t - c.started) : "—");
    set(sel("eta"), c.paused ? "paused" : c.eta ? `${clock(c.eta)} (${dur(c.eta - now)})` : "—");
    set(sel("done"), c.paused ? "paused" : c.done_eta ? `~${clock(c.done_eta)} (${dur(Math.max(0, c.done_eta - now))})` : "—");
  }
  document.querySelectorAll("[data-since]").forEach(e => {
    const t = dur(now - +e.dataset.since);
    if (e.textContent !== t) e.textContent = t;
  });
}

async function refresh() {
  try {
    const r = await fetch("/api/status", {cache: "no-store"});
    const s = await r.json();
    s.jobs = s.jobs || (s.current ? [s.current] : []);
    await Promise.all(s.jobs.map(j => preload(heroName(j))));
    last = s;
    $("stamp").textContent = new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: "2-digit"});
    renderMachines(s.workers); renderJobs(s.jobs); renderQueue(s.queue || []); renderHistory(s.history || []);
    tick();
  } catch (e) {
    $("dot").classList.add("stale");
    $("live").innerHTML = `<span class="err">service not reachable</span>`;
  }
}

document.addEventListener("change", (e) => {
  const ro = e.target.closest("[data-runon]");
  if (ro) { sendItem(ro.closest("[data-item]").dataset.item, {action: "run_on", value: ro.value}); return; }
  const f = e.target.closest("[data-set]");
  if (!f) return;
  const name = f.closest("[data-item]").dataset.item;
  const value = f.type === "checkbox" ? (f.checked ? 1 : 0)
    : f.dataset.choice && f.dataset.set !== "prune_pct" ? f.value : +f.value;
  sendItem(name, {action: "set", key: f.dataset.set, value});
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("input[data-set]")) e.target.blur();  // commits via change
});
// The help column describes whatever setting the pointer or keyboard focus is on.
function followHelp(e) {
  const f = e.target.closest && e.target.closest("[data-help-key]");
  const s = f && f.closest(".settings.helping");
  if (!s) return;
  const name = s.dataset.item;
  if (helpKey[name] === f.dataset.helpKey) return;
  helpKey[name] = f.dataset.helpKey;
  fillHelp();
}
document.addEventListener("mouseover", followHelp);
document.addEventListener("focusin", followHelp);

document.addEventListener("click", (e) => {
  const hb = e.target.closest("[data-help]");
  if (hb) { const n = hb.dataset.help; helpOpen.has(n) ? helpOpen.delete(n) : helpOpen.add(n);
    if (last) { renderQueue(last.queue || []); renderJobs(last.jobs || []); } return; }
  const dm = e.target.closest("[data-dismiss]");
  if (dm) { sendItem(dm.dataset.name, {action: "dismiss", id: dm.dataset.dismiss}); return; }
  const rq = e.target.closest("[data-requeue]");
  if (rq) { const n = rq.dataset.requeue; openSettings.add(n); sendItem(n, {action: "requeue"}); return; }
  const tog = e.target.closest("[data-toggle]");
  if (tog) { const n = tog.dataset.toggle; openSettings.has(n) ? openSettings.delete(n) : openSettings.add(n);
    if (last) renderQueue(last.queue || []); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    const name = act.closest("[data-item]").dataset.item;
    if (act.dataset.act === "cancel" && !confirm(`Cancel ${name}? Training stops now; you can requeue it from Recent.`)) return;
    const body = {action: act.dataset.act};
    if (act.dataset.value !== undefined) body.value = act.dataset.act === "hold" ? act.dataset.value === "true" : act.dataset.value;
    sendItem(name, body); return;
  }
  const pick = e.target.closest("[data-pick]");
  if (pick) { selectedBy[pick.dataset.job] = pick.dataset.pick;
    preload(pick.dataset.pick).then(() => last && renderJobs(last.jobs || [])); return; }
  const z = e.target.closest("[data-zoom]");
  if (z) { $("lightbox").querySelector("img").src = z.src; $("lightbox").classList.add("open"); return; }
  if (e.target.closest("#lightbox")) $("lightbox").classList.remove("open");
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("lightbox").classList.remove("open"); });

refresh();
setInterval(refresh, 3000);
setInterval(tick, 1000);
</script>
</body>
</html>
